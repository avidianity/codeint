[package]
name = "codeint-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "codeint"
path = "src/main.rs"

[dependencies]
codeint-config = { workspace = true }
codeint-git = { workspace = true }
codeint-lang-dart = { workspace = true }
codeint-lang-php = { workspace = true }
codeint-lang-python = { workspace = true }
codeint-lang-rust = { workspace = true }
codeint-lang-ts = { workspace = true }
codeint-model = { workspace = true }
codeint-plugin-host = { workspace = true }
codeint-report = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
toon-format = { workspace = true }

[lints]
workspace = true
