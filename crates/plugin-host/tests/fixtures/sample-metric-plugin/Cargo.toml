[workspace]

[package]
name = "sample-long-functions-plugin"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
codeint-plugin-sdk = { path = "../../../../../crates/plugin-sdk" }

[profile.dev]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
debug = 0
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
