[workspace]
resolver = "3"
members = [
    "probe-runtime",
    "file-reader",
    "socket-opener",
    "clock-reader",
    "loop-language",
    "memory-hog-language",
    "loop-metric",
    "legacy-v0-1-0-language",
    "legacy-v0-1-0-metric",
    "legacy-v0-2-0-language",
    "legacy-v0-2-0-metric",
    "legacy-v0-3-0-language",
    "legacy-v0-3-0-metric",
    "legacy-v0-4-0-language",
    "legacy-v0-4-0-metric",
    "dual-version-language",
    "coverage-reader-metric",
    "coverage-trap-metric",
    "program-start-language",
    "program-start-metric",
    "hazard-rules-language",
    "hazard-facts-metric",
    "folder-import-language",
    "imports-reader-metric",
    "unlisted-hazard-rule-language",
    "no-imports-language",
    "import-capability-metric",
    "reserved-key-metric",
    "zero-version-metric",
    "out-of-range-ratio-metric",
    "invalid-finding-path-metric",
    "stale-reference-range-language",
    "invalid-workspace-root-language",
    "workspace-trap-language",
    "workspace-always-fails-language",
    "workspace-unpassed-path-language",
    "strict-declared-deps-language",
    "workspace-skips-valid-manifest-language",
    "cargo-only-workspace-language",
    "manifest-paths-trap-language",
    "exclude-trap-language",
    "manifest-strict-profiles-language",
    "empty-workspace-multi-manifest-language",
    "source-manifest-workspace-language",
    "source-manifest-profiles-language",
    "single-profile-only-language",
    "multi-profile-only-language",
    "framework-entry-language",
    "profile-imports-language",
    "backslash-extension-language",
    "second-extension-language",
    "crlf-miscount-language",
    "duplicate-extension-language",
    "empty-finding-id-metric",
    "reference-ranges-trap-language",
    "stateful-language",
    "stateful-metric",
    "oversized-lifted-metric",
    "v0-5-0-features-language",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
probe-runtime = { path = "probe-runtime" }
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[profile.dev]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
debug = 0
panic = "abort"
