[workspace]
resolver = "3"
members = [
    "probe-runtime",
    "file-reader",
    "socket-opener",
    "clock-reader",
    "loop-language",
    "memory-hog-language",
    "loop-metric",
    "legacy-v0-1-0-language",
    "legacy-v0-1-0-metric",
    "dual-version-language",
    "coverage-reader-metric",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
probe-runtime = { path = "probe-runtime" }
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[profile.dev]
debug = 0
panic = "abort"
