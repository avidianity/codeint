[workspace]
resolver = "3"
members = ["probe-runtime", "file-reader", "socket-opener", "clock-reader"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
probe-runtime = { path = "probe-runtime" }
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros", "realloc"] }

[profile.dev]
panic = "abort"
