<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>codeint banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  :root {
    --ink: #081112;
    --panel: #0e1c1d;
    --line: rgba(251, 233, 203, 0.08);
    --teal: #275e5e;
    --teal-soft: rgba(39, 94, 94, 0.55);
    --amber: #f78b27;
    --cream: #fbe9cb;
    --cream-dim: rgba(251, 233, 203, 0.72);
    --cream-faint: rgba(251, 233, 203, 0.60);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 700px; overflow: hidden; background: var(--ink); }
  body { font-family: "Geist", system-ui, sans-serif; color: var(--cream); -webkit-font-smoothing: antialiased; }

  .canvas { position: relative; width: 1600px; height: 700px; overflow: hidden; }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 48px 48px;
    background-position: -1px -1px;
    -webkit-mask-image: radial-gradient(ellipse 70% 85% at 72% 50%, #000 0%, rgba(0,0,0,0.35) 55%, transparent 85%);
  }
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(520px 420px at 230px 300px, rgba(39, 94, 94, 0.30), transparent 70%);
  }

  .social, .social body, .social .canvas, .social .intro { height: 800px; }
  .intro { position: absolute; left: 112px; top: 0; height: 700px; width: 640px; display: flex; flex-direction: column; justify-content: center; }
  .mark { display: flex; align-items: center; gap: 30px; }
  .mascot { width: 148px; height: 148px; border-radius: 34px; display: block; box-shadow: 0 0 0 1px rgba(251,233,203,0.10), 0 24px 48px -20px rgba(0,0,0,0.7); }
  .word { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 128px; line-height: 1; letter-spacing: -0.028em; color: var(--cream); font-variation-settings: "opsz" 96; transform: translateY(-6px); }
  .tagline { margin-top: 44px; font-size: 40px; line-height: 1.18; font-weight: 500; letter-spacing: -0.015em; color: var(--cream); max-width: 600px; }
  .tagline em { font-style: normal; color: var(--amber); }
  .sub { margin-top: 20px; font-size: 24px; line-height: 1.45; color: var(--cream-dim); max-width: 560px; }

  .panel { position: absolute; right: 104px; top: 50%; transform: translateY(-50%); width: 650px; border-radius: 22px; background: linear-gradient(180deg, rgba(14,28,29,0.92), rgba(10,21,22,0.92)); box-shadow: inset 0 0 0 1px rgba(251,233,203,0.10), 0 40px 80px -40px rgba(0,0,0,0.8); font-family: "Geist Mono", monospace; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 18px 24px; border-bottom: 1px solid var(--line); }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: rgba(251,233,203,0.14); }
  .bar .title { margin-left: 12px; font-size: 19px; color: var(--cream-faint); }
  .panel-body { padding: 26px 30px 28px; }
  .prompt { font-size: 21px; color: var(--cream); }
  .prompt-sign { color: var(--amber); margin-right: 12px; }
  .source-set { margin-top: 16px; font-size: 19px; color: var(--cream-faint); letter-spacing: 0.02em; }

  .metric { margin-top: 22px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; font-size: 20px; }
  .name { color: var(--cream); }
  .value { color: var(--cream-dim); font-variant-numeric: tabular-nums; }
  .over .value { color: var(--amber); }
  .track { position: relative; margin-top: 12px; height: 10px; border-radius: 5px; background: rgba(251,233,203,0.06); }
  .scale { position: absolute; top: 0; bottom: 0; left: 9px; right: 9px; }
  .range { position: absolute; top: 0; bottom: 0; border-radius: 5px; background: var(--teal-soft); box-shadow: inset 0 0 0 1px rgba(91, 160, 158, 0.35); }
  .marker { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--cream); box-shadow: 0 0 0 4px var(--panel); }
  .over .marker { background: var(--amber); }

  .legend { margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; gap: 30px; font-size: 19px; color: var(--cream-faint); }
  .legend span { display: inline-flex; align-items: center; gap: 9px; }
  .swatch-range { width: 22px; height: 10px; border-radius: 5px; background: var(--teal-soft); box-shadow: inset 0 0 0 1px rgba(91,160,158,0.35); }
  .swatch-over { width: 12px; height: 12px; border-radius: 50%; background: var(--amber); }
</style>
<script>
  if (new URLSearchParams(location.search).get("variant") === "social") document.documentElement.classList.add("social");
</script>
</head>
<body>
<div class="canvas">
  <div class="wash"></div>
  <div class="grid"></div>

  <section class="intro">
    <div class="mark">
      <img class="mascot" src="../mascot.png" alt="">
      <div class="word">codeint</div>
    </div>
    <p class="tagline">See Software entropy grow <em>before it compounds.</em></p>
    <p class="sub">Duplication, Verbosity, Erosion, and Import cycles, each measured on its own and gated in CI.</p>
  </section>

  <section class="panel">
    <div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="title">~/shop</span></div>
    <div class="panel-body">
      <div class="prompt"><span class="prompt-sign">$</span>codeint check</div>
      <div class="source-set">production · 4 files · 39 source lines</div>

      <div class="metric" data-ratio="0.7986" data-low="0.352" data-high="0.6">
        <div class="row"><span class="name">erosion</span><span class="value"></span></div>
        <div class="track"><div class="scale"><div class="range"></div><div class="marker"></div></div></div>
      </div>
      <div class="metric" data-ratio="0" data-low="0.017" data-high="0.346">
        <div class="row"><span class="name">duplication</span><span class="value"></span></div>
        <div class="track"><div class="scale"><div class="range"></div><div class="marker"></div></div></div>
      </div>
      <div class="metric" data-ratio="0.0256" data-low="0.018" data-high="0.347">
        <div class="row"><span class="name">verbosity</span><span class="value"></span></div>
        <div class="track"><div class="scale"><div class="range"></div><div class="marker"></div></div></div>
      </div>
      <div class="metric" data-ratio="0" data-low="0" data-high="0.308">
        <div class="row"><span class="name">import_cycles</span><span class="value"></span></div>
        <div class="track"><div class="scale"><div class="range"></div><div class="marker"></div></div></div>
      </div>

      <div class="legend">
        <span><i class="swatch-range"></i>reference range</span>
        <span><i class="swatch-over"></i>above range</span>
      </div>
    </div>
  </section>
</div>
<script>
  for (const metric of document.querySelectorAll(".metric")) {
    const ratio = Number(metric.dataset.ratio);
    const low = Number(metric.dataset.low);
    const high = Number(metric.dataset.high);
    const range = metric.querySelector(".range");
    range.style.left = `${low * 100}%`;
    range.style.width = `${(high - low) * 100}%`;
    metric.querySelector(".value").textContent = metric.dataset.ratio;
    metric.querySelector(".marker").style.left = `${ratio * 100}%`;
    metric.classList.toggle("over", ratio > high);
  }
</script>
</body>
</html>
