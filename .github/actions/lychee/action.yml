name: Install lychee
description: Download the pinned lychee release and verify it against the checksum pinned here.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        LYCHEE_VERSION: 0.24.2
        ARCHIVE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        archive="lychee-x86_64-unknown-linux-gnu.tar.gz"
        base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
        curl -fsSLO "$base/$archive"
        echo "$ARCHIVE_SHA256  $archive" | sha256sum --check --strict
        tar -xzf "$archive" lychee-x86_64-unknown-linux-gnu/lychee
        sudo install -m 0755 lychee-x86_64-unknown-linux-gnu/lychee /usr/local/bin/lychee
        lychee --version
