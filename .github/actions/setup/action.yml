name: Set up the workspace
description: Restore the Rust cache and install the pinned npm development tools.
inputs:
  rust-cache-key:
    description: Optional shared-key for Swatinem/rust-cache.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: ${{ inputs.rust-cache-key }}
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: npm
    - shell: bash
      run: npm ci --no-audit --no-fund
