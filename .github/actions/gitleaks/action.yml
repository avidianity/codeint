name: Install gitleaks
description: Download the pinned gitleaks release and verify its checksum.
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        curl -fsSLO "$base/$archive"
        curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
        grep " $archive\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check --strict
        tar -xzf "$archive" gitleaks
        sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
        gitleaks version
