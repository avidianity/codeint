name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
      - '!CHANGELOG.md'
      - '!CONTRIBUTING.md'
      - '!GLOSSARY.md'
      - '!LICENSE'
      - '!llms.txt'
      - '!docs/*.md'
      - '!docs/**/*.md'
      - 'docs/reference.md'
      - 'docs/checks/**'
      - 'docs/agents/review-and-merge.md'
      - 'docs/agents/security.md'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!README.md'
      - '!CHANGELOG.md'
      - '!CONTRIBUTING.md'
      - '!GLOSSARY.md'
      - '!LICENSE'
      - '!llms.txt'
      - '!docs/*.md'
      - '!docs/**/*.md'
      - 'docs/reference.md'
      - 'docs/checks/**'
      - 'docs/agents/review-and-merge.md'
      - 'docs/agents/security.md'
  schedule:
    - cron: '30 1 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: rust
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          category: "/language:${{ matrix.language }}"
