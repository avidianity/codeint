name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions: {}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
      - name: Verify manifest versions
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            cargo xtask version-sync --tag "$REF_NAME"
          else
            cargo xtask version-sync
          fi
      - name: Draft release notes
        run: |
          mkdir -p dist
          cargo xtask release-notes --output dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-notes
          path: dist/RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 14

  build:
    name: build (${{ matrix.target }})
    needs: [verify]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            archive_ext: tar.gz
            musl: false
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive_ext: tar.gz
            musl: false
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            archive_ext: tar.gz
            musl: true
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            archive_ext: tar.gz
            musl: true
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            archive_ext: zip
            musl: false
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            archive_ext: zip
            musl: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Add Rust target
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "$TARGET"
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --bin codeint --target "$TARGET"
      - name: Verify binary on Unix
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
          IS_MUSL: ${{ matrix.musl }}
        run: |
          binary="target/$TARGET/release/codeint"
          "$binary" --version
          if [ "$IS_MUSL" = true ]; then
            file "$binary" | grep -qE "statically linked|static-pie linked"
          fi
      - name: Verify binary on Windows
        if: runner.os == 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: ./target/"$TARGET"/release/codeint.exe --version
      - name: Package Unix archive
        if: matrix.archive_ext == 'tar.gz'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist
          tar -C "target/$TARGET/release" -czf "dist/codeint-$TARGET.tar.gz" codeint
      - name: Package Windows archive
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/$env:TARGET/release/codeint.exe" -DestinationPath "dist/codeint-$env:TARGET.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeint-${{ matrix.target }}
          path: dist/codeint-${{ matrix.target }}.${{ matrix.archive_ext }}
          if-no-files-found: error
          retention-days: 14

  checksums-and-attestations:
    name: checksums and attestations
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: codeint-*
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          expected=(
            codeint-aarch64-apple-darwin.tar.gz
            codeint-x86_64-apple-darwin.tar.gz
            codeint-x86_64-unknown-linux-musl.tar.gz
            codeint-aarch64-unknown-linux-musl.tar.gz
            codeint-x86_64-pc-windows-msvc.zip
            codeint-aarch64-pc-windows-msvc.zip
          )
          for file in "${expected[@]}"; do
            test -f "$file"
          done
          LC_ALL=C sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: attestations
          path: ${{ steps.attest.outputs.bundle-path }}
          if-no-files-found: error
          retention-days: 14

  stage-npm:
    name: stage npm packages
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: codeint-*
          path: dist
          merge-multiple: true
      - name: Stage platform binaries and pack npm tarballs
        run: |
          mkdir -p npm-tarballs
          stage_unix() {
            local platform="$1"
            local target="$2"
            local dir="npm/platforms/$platform/bin"
            mkdir -p "$dir"
            tar -xzf "dist/codeint-$target.tar.gz" -C "$dir"
            chmod +x "$dir/codeint"
          }
          stage_windows() {
            local platform="$1"
            local target="$2"
            local dir="npm/platforms/$platform/bin"
            mkdir -p "$dir"
            unzip -qo "dist/codeint-$target.zip" -d "$dir"
          }
          stage_unix darwin-arm64 aarch64-apple-darwin
          stage_unix darwin-x64 x86_64-apple-darwin
          stage_unix linux-arm64 aarch64-unknown-linux-musl
          stage_unix linux-x64 x86_64-unknown-linux-musl
          stage_windows win32-arm64 aarch64-pc-windows-msvc
          stage_windows win32-x64 x86_64-pc-windows-msvc
          pack_dir="$PWD/npm-tarballs"
          version="$(node -p "require('./npm/codeint/package.json').version")"
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            npm pack "./npm/platforms/$platform" --pack-destination "$pack_dir"
            test -f "$pack_dir/avidian-codeint-$platform-$version.tgz"
          done
          npm pack ./npm/codeint --pack-destination "$pack_dir"
          test -f "$pack_dir/codeint-$version.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-tarballs
          path: npm-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 14

  stage-dart:
    name: stage Dart package
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b
      - name: Verify Dart package
        working-directory: sdks/dart
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart pub publish --dry-run

  publish-github-release:
    name: publish GitHub Release
    needs: [verify, checksums-and-attestations, stage-npm, stage-dart]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: codeint-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: SHA256SUMS
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-notes
          path: notes
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          assets=(
            dist/codeint-aarch64-apple-darwin.tar.gz
            dist/codeint-x86_64-apple-darwin.tar.gz
            dist/codeint-x86_64-unknown-linux-musl.tar.gz
            dist/codeint-aarch64-unknown-linux-musl.tar.gz
            dist/codeint-x86_64-pc-windows-msvc.zip
            dist/codeint-aarch64-pc-windows-msvc.zip
            dist/SHA256SUMS
          )
          if [ -f install.sh ]; then
            assets+=(install.sh)
          fi
          if [ -f install.ps1 ]; then
            assets+=(install.ps1)
          fi
          extra_flags=()
          if [[ "$TAG" == *-* ]]; then
            extra_flags+=(--prerelease)
          fi
          gh release create "$TAG" "${assets[@]}" \
            --title "$TAG" \
            --notes-file notes/RELEASE_NOTES.md \
            --verify-tag \
            "${extra_flags[@]}"

  publish-npm:
    name: publish npm packages
    needs: [verify, checksums-and-attestations, stage-npm, stage-dart]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-tarballs
          path: npm-tarballs
      - name: Publish platform packages and wrapper to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-arm64 win32-x64; do
            npm publish "./npm-tarballs/avidian-codeint-$platform-$version.tgz" --provenance --access public
          done
          npm publish "./npm-tarballs/codeint-$version.tgz" --provenance --access public

  publish-pub:
    name: publish Dart package to pub.dev
    needs: [verify, checksums-and-attestations, stage-npm, stage-dart, publish-github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b
      - name: Publish Dart package to pub.dev
        working-directory: sdks/dart
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart pub publish --dry-run
          dart pub publish --force
