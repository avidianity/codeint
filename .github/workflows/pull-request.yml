name: pull-request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  body:
    name: body
    runs-on: ubuntu-24.04
    env:
      BODY: ${{ github.event.pull_request.body }}
      BASE: origin/${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      - run: printf '%s\n' "$BODY" > "$RUNNER_TEMP/body.md"
      - run: cargo xtask evidence-bundle --body-file "$RUNNER_TEMP/body.md"
      - run: cargo xtask behavior-has-test --base "$BASE" --body-file "$RUNNER_TEMP/body.md"
