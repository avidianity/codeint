name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          is_doc_path() {
            case "$1" in
              README.md|CHANGELOG.md|CONTRIBUTING.md|GLOSSARY.md|LICENSE|llms.txt)
                return 0
                ;;
              docs/reference.md|docs/checks/*|docs/agents/review-and-merge.md|docs/agents/security.md)
                return 1
                ;;
              docs/*.md)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          if [ "$EVENT" = pull_request ]; then
            range="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git diff --name-only --no-renames -z "$range" > "$RUNNER_TEMP/changed.bin"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          count=0
          docs_only=true
          while IFS= read -r -d '' path; do
            count=$((count + 1))
            if ! is_doc_path "$path"; then
              docs_only=false
              break
            fi
          done < "$RUNNER_TEMP/changed.bin"

          if [ "$count" -eq 0 ]; then
            docs_only=false
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Classified $count changed file(s): docs_only=$docs_only"

  rust:
    name: rust
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install lld
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
          shared-key: "ubuntu-rust-test"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/wasm-fixtures/wasm32-wasip2/debug/*.wasm
            target/wasm-fixtures/wasm32-wasip2/debug/.fixtures-stamp
          key: v0-wasm-fixtures-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'wit/**', 'crates/plugin-sdk/**', 'crates/plugin-host/tests/fixtures/**') }}
      - run: rustup target add wasm32-wasip2 wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-run
      - name: Test without network access
        run: |
          sudo --preserve-env=PATH,HOME,CARGO_HOME,RUSTUP_HOME,CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER,CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS unshare --net -- bash -c '
            ip link set lo up
            setpriv --reuid="$SUDO_UID" --regid="$SUDO_GID" --init-groups cargo test --workspace --locked --offline
          '

  windows:
    name: windows
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
      - run: cargo test --locked --package codeint-cli --test check repository_root
      - run: cargo test --locked --package codeint-cli --test install_windows

  performance:
    name: performance
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
      - run: cargo build --release --locked --bin codeint
      - run: cargo xtask perf-check

  repository:
    name: repository
    needs: [changes]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/gitleaks
      - run: cargo xtask merged-result
      - name: Choose the base of the change
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "BASE=origin/$BASE_REF" >> "$GITHUB_ENV"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            echo "BASE=$BEFORE" >> "$GITHUB_ENV"
          else
            echo "BASE=$(git rev-list --max-parents=0 HEAD | tail -n 1)" >> "$GITHUB_ENV"
          fi
      - if: needs.changes.outputs.docs_only != 'true'
        run: cargo xtask no-comments --base "$BASE"
      - run: cargo xtask commit-message --range "$BASE"
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run --silent duplicates
      - run: npx --no-install markdownlint-cli2
      - uses: ./.github/actions/lychee
      - run: git ls-files -z '*.md' .rules ':!:.agents/skills/**' | xargs -0 lychee --config lychee.toml
      - if: needs.changes.outputs.docs_only != 'true'
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f
        with:
          tool: cargo-shear@1.14.1
      - if: needs.changes.outputs.docs_only != 'true'
        run: cargo shear
      - if: needs.changes.outputs.docs_only != 'true'
        uses: ./.github/actions/actionlint
      - if: needs.changes.outputs.docs_only != 'true'
        run: actionlint
      - run: gitleaks git --redact --no-banner

  risk-tier:
    name: risk-tier
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          prefix-key: v0-rust-${{ hashFiles('Cargo.toml') }}
      - id: tier
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask risk-tier --base "origin/$BASE_REF" | tee "$RUNNER_TEMP/tier.txt"
      - name: Record the Tier for the label workflow
        env:
          TIER: ${{ steps.tier.outputs.tier }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          [[ "$TIER" =~ ^[0-4]$ ]]
          mkdir -p "$RUNNER_TEMP/tier"
          printf '%s\n' "$TIER" > "$RUNNER_TEMP/tier/tier"
          printf '%s\n' "$PULL_REQUEST" > "$RUNNER_TEMP/tier/pull-request"
          cat "$RUNNER_TEMP/tier.txt" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tier
          path: ${{ runner.temp }}/tier
          if-no-files-found: error
          retention-days: 7

  budget:
    name: budget
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.changes.outputs.docs_only != 'true' }}
    needs: [changes, rust, windows, performance, repository, risk-tier]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      BASE: origin/${{ github.base_ref }}
      SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=lld"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Install lld
        run: |
          sudo apt-get update
          sudo apt-get install -y lld
      - uses: ./.github/actions/setup
        with:
          rust-cache-key: "ubuntu-rust-test"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            target/wasm-fixtures/wasm32-wasip2/debug/*.wasm
            target/wasm-fixtures/wasm32-wasip2/debug/.fixtures-stamp
          key: v0-wasm-fixtures-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'wit/**', 'crates/plugin-sdk/**', 'crates/plugin-host/tests/fixtures/**') }}
      - uses: ./.github/actions/gitleaks
      - uses: ./.github/actions/lychee
      - run: rustup target add wasm32-wasip2 wasm32-unknown-unknown
      - run: cargo build --locked --package xtask
      - name: Git hook loop
        run: |
          files=()
          while IFS= read -r path; do
            files+=(--file "$path")
          done < <(git diff --name-only --diff-filter=d "$BASE...HEAD")
          start=$(date +%s.%N)
          npx --no-install lefthook run pre-commit --force --no-auto-install "${files[@]}"
          seconds=$(echo "$(date +%s.%N) - $start" | bc)
          report=()
          if [ "$SAME_REPOSITORY" = true ]; then report=(--report); fi
          cargo xtask feedback-budget --loop hook --seconds "$seconds" "${report[@]}"
      - name: Relevant tier loop
        run: |
          start=$(date +%s.%N)
          cargo xtask affected-tests --base "$BASE"
          seconds=$(echo "$(date +%s.%N) - $start" | bc)
          report=()
          if [ "$SAME_REPOSITORY" = true ]; then report=(--report); fi
          cargo xtask feedback-budget --loop relevant --seconds "$seconds" "${report[@]}"
      - name: CI gate loop
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          report=()
          if [ "$SAME_REPOSITORY" = true ]; then report=(--report); fi
          cargo xtask feedback-budget --loop ci-gate --run-id "$RUN_ID" --exclude-job budget --exclude-workflow CodeQL "${report[@]}"
