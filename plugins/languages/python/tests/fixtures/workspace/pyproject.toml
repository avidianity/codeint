[project]
name = "acme-root"
dependencies = [
    "Requests>=2.31.0",
    "Pydantic_Settings[dotenv]>=2.4 ; python_version >= '3.10'",
]

[project.optional-dependencies]
postgres = ["Psycopg_Pool>=3.2"]

[dependency-groups]
dev = [
    { include-group = "lint" },
    "pytest>=8.3",
]
lint = ["ruff>=0.7"]

[tool.uv.workspace]
members = ["packages/*"]
