[workspace]
resolver = "3"
members = ["crates/*", "eval", "plugins/languages/*", "xtask"]

[workspace.package]
version = "0.8.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
clap = { version = "=4.6.9", features = ["derive"] }
codeint-config = { path = "crates/config" }
codeint-eval = { path = "eval" }
codeint-git = { path = "crates/git" }
codeint-lang-dart = { path = "plugins/languages/dart" }
codeint-lang-go = { path = "plugins/languages/go" }
codeint-lang-php = { path = "plugins/languages/php" }
codeint-lang-python = { path = "plugins/languages/python" }
codeint-lang-rust = { path = "plugins/languages/rust" }
codeint-lang-shell = { path = "plugins/languages/shell" }
codeint-lang-sql = { path = "plugins/languages/sql" }
codeint-lang-ts = { path = "plugins/languages/ts" }
codeint-metrics = { path = "crates/metrics" }
codeint-model = { path = "crates/model" }
codeint-plugin-host = { path = "crates/plugin-host" }
codeint-report = { path = "crates/report" }
dlmalloc = { version = "=0.2.14", features = ["global"] }
gix = { version = "=0.90.0", default-features = false, features = ["dirwalk", "revision", "sha1"] }
globset = "=0.4.21"
jsonc-parser = { version = "=0.34.0", features = ["serde", "serde_json", "preserve_order"] }
oxc_allocator = "=0.159.0"
oxc_ast = "=0.159.0"
oxc_ast_visit = "=0.159.0"
oxc_parser = "=0.159.0"
oxc_resolver = "=11.24.3"
oxc_span = "=0.159.0"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
rayon = "=1.12.0"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.1.1", default-features = false, features = ["deserialize"] }
serde_json = "=1.0.154"
sqlparser = "=0.64.0"
syn = { version = "=2.0.119", features = ["full", "visit"] }
tempfile = "=3.27.0"
thiserror = "=2.0.21"
toml = "=1.2.1"
toon-format = { version = "=0.7.0", default-features = false }
wasmtime = { version = "=51.0.0", default-features = false, features = ["component-model", "cranelift", "runtime", "std"] }
wit-bindgen = { version = "=0.63.0", default-features = false, features = ["macros"] }
wit-component = { version = "=0.263.0", default-features = false }

[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[profile.dev]
debug = 0

[profile.dev.package]
cranelift-codegen.opt-level = 1
cranelift-frontend.opt-level = 1
regalloc2.opt-level = 1
wasmtime-internal-cranelift.opt-level = 1
