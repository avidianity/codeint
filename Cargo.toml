[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
globset = "=0.4.21"
serde_json = "=1.0.154"
toml = "=1.2.1"

[workspace.lints.rust]
unused = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
